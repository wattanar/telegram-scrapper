[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgmedia"
version = "0.1.0"
description = "Download media from a Telegram group or channel with a user account"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
tgmedia = "tgmedia.cli:main"

[tool.setuptools]
packages = ["tgmedia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
